[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotretrain-nyc"
version = "0.1.0"
description = "End-to-end MLOps platform for NYC Yellow Taxi demand forecasting"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"