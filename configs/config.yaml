data:
  coverage_target: 0.99

model:
  device: cpu
  seasonal_k: 24
  horizon: 336

validation:
  final_holdout_hours: 336
  walk_forward_horizon: 48
  walk_forward_stride: 168
  minimum_train_hours: 1440

inference:
  horizon: 168

features:
  lags:
    - -1
    - -2
    - -3
    - -24
    - -48
    - -72
    - -96
    - -120
    - -144
    - -168

selection:
  metric: cv_mae

quality_gate:
  metric: mae
  max_degradation: 0.05